name: bats

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions: {}

jobs:
  bats:
    name: bats e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # A pinned version and the token keep the action off the unauthenticated
    # GitHub API, whose rate limit made the download fail. The tests use no
    # bats libraries.
    - name: Set up bats
      uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
      with:
        bats-version: 1.11.1
        github-token: ${{ secrets.GITHUB_TOKEN }}
        support-install: false
        assert-install: false
        detik-install: false
        file-install: false

    - name: Run bats tests
      env:
        TERM: xterm
      run: bats -T -o _artifacts --print-output-on-failure tests/

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kind-logs-bats-${{ github.run_id }}
        path: ./_artifacts
